apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }} # Matches the label in deployment
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}        # Port 80 (external)
      targetPort: {{ .Values.service.targetPort }} # Port 8080 (internal)
      name: http
